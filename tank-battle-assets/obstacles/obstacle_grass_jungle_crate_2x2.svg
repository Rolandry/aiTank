<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" shape-rendering="crispEdges">
  <!-- 草地丛林 · 木箱 · 2×2格(64×64px) -->
  <!-- 箱体阴影 -->
  <rect x="4" y="4" width="56" height="56" fill="#4E342E"/>
  <!-- 箱体主体 -->
  <rect x="6" y="6" width="52" height="52" fill="#8D6E63"/>
  <rect x="4" y="8" width="56" height="48" fill="#8D6E63"/>
  <!-- 木板纹理 -->
  <rect x="6" y="6" width="52" height="2" fill="#A1887F"/>
  <rect x="6" y="20" width="52" height="2" fill="#6D4C41"/>
  <rect x="6" y="34" width="52" height="2" fill="#6D4C41"/>
  <rect x="6" y="48" width="52" height="2" fill="#6D4C41"/>
  <!-- X 形加固带 -->
  <rect x="6" y="6" width="2" height="52" fill="#5D4037"/>
  <rect x="56" y="6" width="2" height="52" fill="#5D4037"/>
  <rect x="6" y="56" width="52" height="2" fill="#5D4037"/>
  <!-- 中心锁扣 -->
  <rect x="28" y="28" width="8" height="8" fill="#FFC107"/>
  <rect x="30" y="30" width="4" height="4" fill="#FFD54F"/>
</svg>