<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" shape-rendering="crispEdges">
  <!-- 爆炸帧1：命中闪光 · 16px直径光点 · 中心(32,32)对齐 -->
  <!-- 中心亮白光点 -->
  <rect x="24" y="22" width="16" height="20" fill="#FFFFFF"/>
  <rect x="22" y="24" width="20" height="16" fill="#FFFFFF"/>
  <!-- 外围高亮 -->
  <rect x="20" y="26" width="24" height="12" fill="#FFF9C4"/>
  <rect x="26" y="20" width="12" height="24" fill="#FFF9C4"/>
  <!-- 光芒射线 -->
  <rect x="31" y="8" width="2" height="12" fill="#FFFFFF" opacity="0.8"/>
  <rect x="31" y="44" width="2" height="12" fill="#FFFFFF" opacity="0.8"/>
  <rect x="8" y="31" width="12" height="2" fill="#FFFFFF" opacity="0.8"/>
  <rect x="44" y="31" width="12" height="2" fill="#FFFFFF" opacity="0.8"/>
  <!-- 对角光芒 -->
  <rect x="14" y="14" width="2" height="2" fill="#FFFFFF" opacity="0.5"/>
  <rect x="48" y="14" width="2" height="2" fill="#FFFFFF" opacity="0.5"/>
  <rect x="14" y="48" width="2" height="2" fill="#FFFFFF" opacity="0.5"/>
  <rect x="48" y="48" width="2" height="2" fill="#FFFFFF" opacity="0.5"/>
</svg>