<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" shape-rendering="crispEdges">
  <!-- 雪地冰原 · 雪块 · 2×1格(64×32px) -->
  <!-- 雪块阴影 -->
  <rect x="4" y="8" width="56" height="18" fill="#CFD8DC"/>
  <!-- 雪块主体 -->
  <rect x="6" y="4" width="52" height="22" fill="#ECEFF1"/>
  <rect x="4" y="8" width="56" height="16" fill="#ECEFF1"/>
  <!-- 雪面纹理 -->
  <rect x="8" y="6" width="12" height="8" fill="#F5F5F5"/>
  <rect x="30" y="8" width="10" height="6" fill="#F5F5F5"/>
  <rect x="48" y="6" width="6" height="6" fill="#F5F5F5"/>
  <!-- 冰层 -->
  <rect x="10" y="14" width="8" height="2" fill="#B3E5FC"/>
  <rect x="36" y="16" width="6" height="2" fill="#B3E5FC"/>
  <!-- 雪块裂缝 -->
  <rect x="28" y="6" width="2" height="14" fill="#B0BEC5"/>
  <rect x="44" y="8" width="2" height="10" fill="#B0BEC5"/>
</svg>