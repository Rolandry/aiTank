<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" shape-rendering="crispEdges">
  <!-- 黄色击杀标记 · 正俯视 · 20×20px -->
  <!-- 外圈边框 -->
  <rect x="2" y="2" width="16" height="16" fill="#C8A823" rx="1"/>
  <!-- 主体五角星 -->
  <polygon points="10,4 11,8 15,8 12,11 13,15 10,12 7,15 8,11 5,8 9,8" fill="#FDD835"/>
  <!-- 高光细节 -->
  <rect x="9" y="5" width="2" height="2" fill="#FFEB3B" opacity="0.8"/>
  <!-- 深色边缘 -->
  <rect x="2" y="2" width="16" height="1" fill="#F9A825" opacity="0.6"/>
</svg>
