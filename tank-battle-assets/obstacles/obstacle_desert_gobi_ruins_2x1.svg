<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" shape-rendering="crispEdges">
  <!-- 荒漠戈壁 · 废墟 · 2×1格(64×32px) · 深色版 -->
  <!-- 废墟底座 -->
  <rect x="2" y="8" width="60" height="20" fill="#4E342E"/>
  <!-- 残墙 -->
  <rect x="4" y="4" width="18" height="22" fill="#5D4037"/>
  <rect x="26" y="8" width="14" height="18" fill="#4E342E"/>
  <rect x="44" y="6" width="16" height="20" fill="#5D4037"/>
  <!-- 破损边缘 -->
  <rect x="4" y="4" width="18" height="2" fill="#795548"/>
  <rect x="22" y="10" width="4" height="6" fill="#4E342E"/>
  <rect x="44" y="6" width="16" height="2" fill="#795548"/>
  <!-- 裂缝 -->
  <rect x="12" y="8" width="2" height="12" fill="#3E2723"/>
  <rect x="50" y="10" width="2" height="10" fill="#3E2723"/>
  <!-- 碎石 -->
  <rect x="36" y="20" width="4" height="4" fill="#8D6E63"/>
  <rect x="24" y="22" width="4" height="4" fill="#795548"/>
</svg>
