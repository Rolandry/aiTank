  <rect x="4" y="6" width="56" height="22" fill="#616161"/>
  <!-- 岩石主体 -->
  <rect x="6" y="4" width="52" height="20" fill="#9E9E9E"/>
  <rect x="4" y="8" width="56" height="16" fill="#9E9E9E"/>
  <!-- 岩石高光 -->
  <rect x="8" y="6" width="12" height="8" fill="#BDBDBD"/>
  <rect x="32" y="8" width="8" height="6" fill="#BDBDBD"/>
  <!-- 岩石裂缝 -->
  <rect x="26" y="6" width="2" height="14" fill="#757575"/>
  <rect x="42" y="10" width="2" height="10" fill="#757575"/>
  <!-- 苔藓 -->
  <rect x="8" y="18" width="6" height="4" fill="#4CAF50"/>
  <rect x="48" y="16" width="4" height="4" fill="#66BB6A"/>
