  <rect x="0" y="4" width="64" height="56" fill="#E0E0E0" opacity="0.25"/>
  <!-- 中层烟雾 -->
  <rect x="8" y="6" width="48" height="52" fill="#BDBDBD" opacity="0.3"/>
