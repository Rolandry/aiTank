<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" shape-rendering="crispEdges">
  <!-- 雪地冰原 · 冰堆 · 1×1格(32×32px) · 深蓝色版 -->
  <!-- 冰堆阴影 -->
  <rect x="4" y="10" width="24" height="16" fill="#0D47A1"/>
  <!-- 冰堆主体 -->
  <rect x="6" y="6" width="20" height="20" fill="#1565C0"/>
  <rect x="4" y="10" width="24" height="14" fill="#1565C0"/>
  <!-- 冰面高光 -->
  <rect x="8" y="8" width="8" height="6" fill="#1976D2"/>
  <rect x="20" y="12" width="4" height="4" fill="#1976D2"/>
  <!-- 冰裂缝 -->
  <rect x="16" y="8" width="1" height="12" fill="#0D47A1"/>
  <rect x="12" y="16" width="6" height="1" fill="#0D47A1"/>
  <!-- 冰晶 -->
  <rect x="10" y="20" width="2" height="2" fill="#42A5F5"/>
  <rect x="22" y="18" width="2" height="2" fill="#42A5F5"/>
</svg>
