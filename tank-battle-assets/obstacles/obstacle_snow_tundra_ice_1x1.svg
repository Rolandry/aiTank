<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" shape-rendering="crispEdges">
  <!-- 雪地冰原 · 冰堆 · 1×1格(32×32px) -->
  <!-- 冰堆阴影 -->
  <rect x="4" y="10" width="24" height="16" fill="#90CAF9"/>
  <!-- 冰堆主体 -->
  <rect x="6" y="6" width="20" height="20" fill="#BBDEFB"/>
  <rect x="4" y="10" width="24" height="14" fill="#BBDEFB"/>
  <!-- 冰面高光 -->
  <rect x="8" y="8" width="8" height="6" fill="#E3F2FD"/>
  <rect x="20" y="12" width="4" height="4" fill="#E3F2FD"/>
  <!-- 冰裂缝 -->
  <rect x="16" y="8" width="1" height="12" fill="#64B5F6"/>
  <rect x="12" y="16" width="6" height="1" fill="#64B5F6"/>
  <!-- 冰晶 -->
  <rect x="10" y="20" width="2" height="2" fill="#E1F5FE"/>
  <rect x="22" y="18" width="2" height="2" fill="#E1F5FE"/>
</svg>